[client]
toolbarMode = "viewer"
showSidebarNavigation = false

[server]
# The deployed app is rebuilt explicitly; scanning Transformers' lazy modules
# causes irrelevant optional vision imports and expensive watcher activity.
fileWatcherType = "none"

[theme]
base = "light"
primaryColor = "#6F4B9F"
backgroundColor = "#EFEDF1"
secondaryBackgroundColor = "#F8F7F9"
textColor = "#29232F"
font = "sans-serif"
