services:
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mysearchengine-app:latest
    container_name: nlp-search-optimized
    restart: unless-stopped
    ports:
      - "127.0.0.1:8502:8501"
    volumes:
      - ./data:/app/data
      - app_stats:/app/stats
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_USER: ${OPENSEARCH_USER:-admin}
      OPENSEARCH_PASS: ${OPENSEARCH_PASS:-admin}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3-30b-a3b-instruct-2507}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-60}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-4096}
      OPENROUTER_TEMPERATURE: ${OPENROUTER_TEMPERATURE:-0.1}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-1}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-AI Conference Research Assistant}
      TESSERACT_CMD: /usr/bin/tesseract
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: "8192"
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    networks:
      - nlp-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch-optimized
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      bootstrap.memory_lock: "true"
      indices.memory.index_buffer_size: 20%
      thread_pool.search.queue_size: "1000"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nlp-network

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server --appendonly yes --maxmemory 512mb
      --maxmemory-policy allkeys-lru --save 300 1 --tcp-keepalive 60 --hz 20
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nlp-network

  searxng:
    image: searxng/searxng:latest
    container_name: searxng-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8888
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nlp-network

networks:
  nlp-network:
    driver: bridge

volumes:
  opensearch_data:
  redis_data:
  app_stats:
